services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: quattro
      POSTGRES_PASSWORD: quattro
      POSTGRES_DB: quattro
    ports:
      - "5432:5432"
    volumes:
      - quattro_postgres_data:/var/lib/postgresql/data

volumes:
  quattro_postgres_data:
